<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ralkerie</title>


    <!-- =====================================================
         FONT
    ====================================================== -->

    <style>

        @font-face {

            font-family: "AndyB";

            src:
                url("./assets/fonts/ANDYB.TTF")
                format("truetype");

            font-weight: normal;

            font-style: normal;

            font-display: swap;
        }


        /* =================================================
           RESET
        ================================================= */

        * {

            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;
        }


        body {

            background: #050505;

            color: white;

            font-family:
                "AndyB",
                Arial,
                sans-serif;

            overflow: hidden;

            image-rendering: pixelated;
        }


        /* =================================================
           BACKGROUND
        ================================================= */

        #stars {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;

            background: transparent;
        }


        #meteors {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: visible;

            pointer-events: none;

            z-index: 3;
        }


        /* =================================================
           METEOR
        ================================================= */

        .meteor-hitbox {

            position: absolute;

            width: 20px;
            height: 20px;

            margin: -10px;

            pointer-events: auto;

            cursor: pointer;

            z-index: 3;

            animation:
                meteorMove
                5.5s
                linear
                forwards;
        }


        .meteor {

            position: absolute;

            left: 0;
            top: 0;

            width: 12px;
            height: 12px;

            background: white;

            transform: rotate(45deg);

            pointer-events: none;

            z-index: 5;

            box-shadow:

                0 0 4px white,

                0 0 8px white,

                0 0 14px #ffb3e7,

                0 0 22px #ff66cc,

                0 0 35px #ff2db5;
        }


        /* =================================================
           METEOR HEAD
        ================================================= */

        .meteor::after {

            content: "";

            position: absolute;

            left: -5px;
            top: -5px;

            width: 22px;
            height: 22px;

            background:
                linear-gradient(
                    135deg,

                    #ff42c2 0%,
                    #ff42c2 20%,

                    #ffffff 20%,
                    #ffffff 58%,

                    #ff9de0 58%,
                    #ff9de0 78%,

                    #ff2db5 78%
                );

            clip-path:
                polygon(
                    50% 0%,
                    100% 50%,
                    50% 100%,
                    0% 50%
                );
        }


        /* =================================================
           METEOR TRAIL

           Extends BEHIND the meteor.
        ================================================= */

        .meteor::before {

            content: "";

            position: absolute;

            right: 7px;

            top: 50%;

            width: 600px;

            height: 14px;

            transform:
                translateY(-50%);

            transform-origin:
                right center;

            background:
                linear-gradient(
                    to left,

                    #ffffff 0%,

                    #ffffff 4%,

                    #ffd8f3 10%,

                    #ff9bdd 24%,

                    #ff63cb 45%,

                    #ff3dbd 68%,

                    rgba(
                        255,
                        61,
                        189,
                        0.2
                    ) 88%,

                    transparent 100%
                );

            clip-path:
                polygon(
                    0 15%,
                    12% 25%,
                    40% 35%,
                    70% 43%,
                    100% 48%,
                    100% 52%,
                    70% 57%,
                    40% 65%,
                    12% 75%,
                    0 85%
                );

            pointer-events: none;
        }


        /* =================================================
           METEOR MOVEMENT

           Starts above/right and travels
           diagonally down-left.
        ================================================= */

        @keyframes meteorMove {

            from {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );

                opacity: 0;
            }


            7% {

                opacity: 1;
            }


            85% {

                opacity: 1;
            }


            to {

                transform:
                    translate3d(
                        -120vw,
                        120vh,
                        0
                    );

                opacity: 0;
            }

        }


        /* =================================================
           METEOR POPUP
        ================================================= */

        .meteor-popup {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.78
                );

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            z-index: 99999;

            transition:
                opacity 0.15s ease;
        }


        .meteor-popup.visible {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        .meteor-popup-box {

            position: relative;

            padding: 8px;

            background: black;

            border:
                2px solid white;

            box-shadow:
                0 0 30px
                rgba(
                    255,
                    70,
                    190,
                    0.5
                );
        }


        .meteor-popup-gif {

            display: block;

            max-width: 80vw;

            max-height: 75vh;

            image-rendering: pixelated;
        }


        .meteor-popup-close {

            position: absolute;

            top: -16px;

            right: -16px;

            width: 30px;

            height: 30px;

            padding: 0;

            border:
                2px solid white;

            background: black;

            color: white;

            font-family:
                "AndyB",
                Arial,
                sans-serif;

            font-size: 23px;

            cursor: pointer;

            z-index: 10;
        }


        .meteor-popup-close:hover {

            background: #222;

            color: #ff8bdc;
        }


        /* =================================================
           NAVIGATION
        ================================================= */

        .pixel-tabs {

            position: fixed;

            top: 20px;

            right: 24px;

            display: flex;

            align-items: center;

            gap: 4px;

            padding: 5px;

            z-index: 1000;

            background: black;

            border:
                2px solid #1c1c1c;

            box-shadow:
                3px 3px 0 black;

            white-space: nowrap;
        }


        .pixel-tab {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            height: 36px;

            min-width: 68px;

            padding: 0 13px;

            border: 0;

            background: black;

            color: white;

            font-family:
                "AndyB",
                Arial,
                sans-serif;

            font-size: 18px;

            cursor: pointer;

            box-shadow:
                inset 2px 2px 0 #222,
                inset -2px -2px 0 #000;
        }


        .pixel-tab:hover {

            background: #161616;
        }


        .pixel-tab.active {

            background: #0b0b0b;

            box-shadow:
                inset 0 -2px 0 white,
                inset 2px 2px 0 #292929;
        }


        /* =================================================
           MAIN
        ================================================= */

        main {

            position: relative;

            width: 100vw;

            height: 100vh;

            z-index: 10;
        }


        /* =================================================
           PAGE
        ================================================= */

        .pixel-page {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            width: 100vw;

            height: 100vh;

            padding:
                100px
                30px
                30px;

            z-index: 10;
        }


        .pixel-page.active {

            display: flex;
        }


        /* =================================================
           LIVE
        ================================================= */

        .live-content {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 28px;

            width: 100%;
        }


        /* =================================================
           BIGGER RALKERIE PNG
        ================================================= */

        .username-png {

            display: block;

            width: 430px;

            max-width: 82vw;

            height: auto;

            object-fit: contain;

            image-rendering: pixelated;

            user-select: none;

            pointer-events: none;

            position: relative;

            z-index: 30;
        }


        /* =================================================
           WAVEFORM WRAPPER

           Width is EXACTLY the Discord card width.
        ================================================= */

        .waveform-wrapper {

            position: relative;

            width:
                min(
                    620px,
                    90vw
                );

            z-index: 20;
        }


        /* =================================================
           WAVEFORM FRAME

           This surrounds the card.
        ================================================= */

        .wave-border {

            position: absolute;

            left: -28px;

            right: -28px;

            top: -28px;

            bottom: -28px;

            pointer-events: none;

            z-index: 1;
        }


        /* =================================================
           WAVE BARS
        ================================================= */

        .wave-bar {

            position: absolute;

            display: block;

            background:
                linear-gradient(
                    to bottom,

                    white 0%,

                    white 20%,

                    #ffd5f3 45%,

                    #ff72cf 70%,

                    #ff2db5 100%
                );

            box-shadow:

                0 0 3px white,

                0 0 6px #ff9bdd,

                0 0 11px
                rgba(
                    255,
                    45,
                    181,
                    0.85
                );

            border-radius: 1px;

            opacity: 0.95;

            pointer-events: none;

            will-change:
                width,
                height;
        }


        /* =================================================
           DISCORD CONTAINER
        ================================================= */

        .discord-card-container {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            z-index: 5;
        }


        /* =================================================
           DISCORD CARD
        ================================================= */

        .discord-live-card {

            position: relative;

            width: 100%;

            padding: 24px;

            background:
                rgba(
                    5,
                    5,
                    5,
                    0.97
                );

            border:
                2px solid white;

            box-shadow:
                6px 6px 0 black;

            z-index: 10;
        }


        /* =================================================
           DISCORD
        ================================================= */

        .discord-profile {

            display: flex;

            align-items: center;

            gap: 18px;
        }


        .discord-avatar {

            width: 76px;

            height: 76px;

            object-fit: cover;

            image-rendering: pixelated;

            border:
                2px solid white;
        }


        .discord-name {

            font-size: 28px;

            color: white;
        }


        .discord-status {

            margin-top: 5px;

            font-size: 14px;
        }


        .status-online {

            color: #7cff7c;
        }


        .status-idle {

            color: #ffd65c;
        }


        .status-dnd {

            color: #ff6666;
        }


        .status-offline {

            color: #888;
        }


        /* =================================================
           ACTIVITY
        ================================================= */

        .discord-activity {

            margin-top: 24px;

            padding-top: 18px;

            border-top:
                2px solid #222;
        }


        .discord-activity-title {

            font-size: 13px;

            color: #ff72cf;

            letter-spacing: 2px;
        }


        .discord-activity-text {

            margin-top: 6px;

            font-size: 22px;

            color: white;
        }


        /* =================================================
           SPOTIFY
        ================================================= */

        .discord-spotify {

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                2px solid #222;
        }


        .discord-section-label {

            font-size: 13px;

            color: #ff72cf;

            letter-spacing: 2px;
        }


        .spotify-row {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-top: 10px;
        }


        .spotify-art {

            width: 58px;

            height: 58px;

            object-fit: cover;

            image-rendering: pixelated;
        }


        .spotify-song {

            font-size: 18px;

            color: white;
        }


        .spotify-artist {

            margin-top: 3px;

            font-size: 14px;

            color: #aaa;
        }


        /* =================================================
           CLOCK
        ================================================= */

        .local-clock {

            margin-top: 24px;

            padding-top: 18px;

            border-top:
                2px solid #222;

            text-align: center;
        }


        .clock-time {

            font-size: 32px;

            line-height: 1;

            color: white;

            text-shadow:
                3px 3px 0 black;
        }


        .clock-label {

            margin-top: 6px;

            font-size: 12px;

            letter-spacing: 2px;

            color: #ff72cf;
        }


        /* =================================================
           PANELS
        ================================================= */

        .pixel-panel {

            position: relative;

            width:
                min(
                    700px,
                    85vw
                );

            padding: 35px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.82
                );

            border:
                2px solid white;

            box-shadow:
                6px 6px 0 black;

            text-align: center;
        }


        .pixel-label {

            margin:
                0 0 8px;

            font-size: 18px;

            color: #aaa;
        }


        .pixel-panel h1 {

            margin:
                0 0 15px;

            font-size:
                clamp(
                    36px,
                    5vw,
                    64px
                );

            font-weight: normal;

            color: white;

            text-shadow:
                3px 3px 0 black;
        }


        .pixel-description {

            margin: 0;

            color: #bdbdbd;

            font-size: 18px;

            line-height: 1.5;
        }


        /* =================================================
           MUSIC
        ================================================= */

        .music-card {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-top: 25px;

            padding: 12px;

            background: #080808;

            border:
                1px solid #333;

            text-align: left;
        }


        .music-cover {

            width: 55px;

            height: 55px;

            flex-shrink: 0;

            background: #151515;

            border:
                1px solid #444;
        }


        .music-info {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .music-info strong {

            color: white;

            font-size: 17px;
        }


        .music-info span {

            color: #888;

            font-size: 15px;
        }


        /* =================================================
           LINKS
        ================================================= */

        .link-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 8px;

            margin-top: 25px;
        }


        .pixel-link {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 45px;

            background: #050505;

            border:
                1px solid #333;

            color: white;

            text-decoration: none;

            font-size: 18px;
        }


        .pixel-link:hover {

            background: #171717;

            border-color: white;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            .pixel-tabs {

                top: 12px;

                right: 12px;

                left: 12px;

                max-width:
                    calc(
                        100vw - 24px
                    );

                overflow-x: auto;

                justify-content:
                    flex-start;
            }


            .pixel-tab {

                min-width: 55px;

                height: 32px;

                padding:
                    0 9px;

                font-size: 15px;
            }


            .pixel-page {

                padding:
                    80px
                    15px
                    20px;
            }


            .live-content {

                gap: 22px;
            }


            .username-png {

                width: 330px;
            }


            .waveform-wrapper {

                width: 92vw;
            }


            .wave-border {

                left: -20px;

                right: -20px;

                top: -20px;

                bottom: -20px;
            }


            .discord-live-card {

                padding: 18px;
            }


            .pixel-panel {

                width: 92vw;

                padding:
                    25px
                    18px;
            }


            .link-grid {

                grid-template-columns:
                    1fr;
            }

        }

    </style>


    <!-- =====================================================
         STAR CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/background.css"
    >

</head>


<body>


    <!-- =====================================================
         STARS
    ====================================================== -->

    <div
        id="stars"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         METEORS
    ====================================================== -->

    <div
        id="meteors"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav
        class="pixel-tabs"
        aria-label="Main navigation"
    >

        <button
            class="pixel-tab active"
            data-page="live"
            type="button"
        >
            LIVE
        </button>


        <button
            class="pixel-tab"
            data-page="music"
            type="button"
        >
            MUSIC
        </button>


        <button
            class="pixel-tab"
            data-page="links"
            type="button"
        >
            LINKS
        </button>


        <button
            class="pixel-tab"
            data-page="tools"
            type="button"
        >
            TOOLS
        </button>


        <button
            class="pixel-tab"
            data-page="about"
            type="button"
        >
            ABOUT
        </button>

    </nav>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             LIVE
        ================================================== -->

        <section
            id="live"
            class="pixel-page active"
        >

            <div class="live-content">


                <!-- BIGGER PNG -->

                <img
                    class="username-png"
                    src="./assets/images/username.png"
                    alt="Ralkerie"
                >


                <!-- WAVEFORM WRAPS THIS -->

                <div
                    id="waveform-wrapper"
                    class="waveform-wrapper"
                >

                    <div
                        id="discord-card-container"
                        class="discord-card-container"
                    >

                        <div
                            class="discord-live-card"
                        >

                            Loading Discord...

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             MUSIC
        ================================================== -->

        <section
            id="music"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    MUSIC
                </p>

                <h1>
                    NOW PLAYING
                </h1>

                <div class="music-card">

                    <div
                        class="music-cover"
                    ></div>

                    <div class="music-info">

                        <strong>
                            No song playing
                        </strong>

                        <span>
                            Spotify
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             LINKS
        ================================================== -->

        <section
            id="links"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    LINKS
                </h1>

                <div class="link-grid">

                    <a
                        href="#"
                        class="pixel-link"
                    >
                        DISCORD
                    </a>


                    <a
                        href="https://github.com/Joahm123/ralkerie.github.io"
                        class="pixel-link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GITHUB
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        SPOTIFY
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        OTHER
                    </a>

                </div>

            </div>

        </section>


        <!-- =================================================
             TOOLS
        ================================================== -->

        <section
            id="tools"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    TOOLS
                </h1>

                <p class="pixel-description">
                    Tools and projects will go here.
                </p>

            </div>

        </section>


        <!-- =================================================
             ABOUT
        ================================================== -->

        <section
            id="about"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    ABOUT
                </h1>

                <p class="pixel-description">
                    Welcome to my little corner
                    of the internet.
                </p>

            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./js/stars.js"></script>

    <script src="./js/meteors.js"></script>

    <script src="./js/waveform.js"></script>

    <script src="./js/main.js"></script>

    <script src="./js/discord.js"></script>

</body>

</html>
