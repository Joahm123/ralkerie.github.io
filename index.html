<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ralkerie</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050208;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   SPACE BACKGROUND
===================================================== */

#background {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    background:
        radial-gradient(
            ellipse at center,
            #3b1737 0%,
            #210c20 35%,
            #0d050f 70%,
            #020103 100%
        );
}

#background::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 15% 45%,
            rgba(255, 40, 190, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(255, 90, 220, 0.15),
            transparent 35%
        );
}


/* =====================================================
   STARS
===================================================== */

#stars {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    z-index: 1;

    pointer-events: none;
}

.star {
    position: absolute;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px white,
        0 0 10px rgba(255, 180, 235, 0.9);

    will-change: left, top;
}


/* =====================================================
   METEORS
===================================================== */

#meteors {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: visible;

    z-index: 2;

    pointer-events: none;
}

.meteor {
    position: absolute;

    /*
       THINNER
    */

    height: 6px;

    border-radius: 999px;

    transform: rotate(46deg);

    transform-origin: right center;

    /*
       WHITE + PINK METEOR
       No black.
    */

    background: linear-gradient(
        to right,
        rgba(255, 90, 210, 0),
        rgba(255, 100, 220, 0.25),
        rgba(255, 180, 240, 0.8),
        white
    );

    box-shadow:
        0 0 8px white,
        0 0 18px rgba(255, 120, 225, 0.95),
        0 0 35px rgba(255, 50, 200, 0.8);
}


/* =====================================================
   PINK + WHITE TRAIL
===================================================== */

.meteor::before {
    content: "";

    position: absolute;

    right: 0;
    top: 50%;

    /*
       LONG TRAIL
    */

    width: 1100px;

    /*
       THIN TRAIL
    */

    height: 18px;

    transform: translateY(-50%);

    border-radius: 999px;

    /*
       ONLY PINK + WHITE
       No dark/black colors.
    */

    background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0),
        rgba(255, 120, 225, 0.08),
        rgba(255, 100, 220, 0.22),
        rgba(255, 160, 235, 0.55),
        rgba(255, 220, 250, 0.9)
    );

    filter: blur(8px);

    pointer-events: none;
}


/* =====================================================
   BRIGHT METEOR HEAD
===================================================== */

.meteor::after {
    content: "";

    position: absolute;

    right: -6px;
    top: 50%;

    width: 16px;
    height: 16px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px white,
        0 0 30px #ffb8e9,
        0 0 50px #ff4ac5;
}


/* =====================================================
   TITLE
===================================================== */

#content {
    position: fixed;
    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   TITLE CARD
===================================================== */

#card {
    padding: 45px 70px;

    min-width: 320px;

    text-align: center;

    background: rgba(8, 3, 12, 0.8);

    border: 1px solid rgba(255, 180, 235, 0.22);

    border-radius: 24px;

    box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(255, 50, 190, 0.12);

    backdrop-filter: blur(18px);
}

#card h1 {
    font-size: clamp(48px, 7vw, 90px);

    letter-spacing: 3px;

    color: white;

    text-shadow:
        0 0 15px rgba(255, 160, 230, 0.4),
        0 0 40px rgba(255, 60, 190, 0.2);
}

#card p {
    margin-top: 12px;

    color: rgba(255, 210, 240, 0.75);

    font-size: 18px;

    letter-spacing: 2px;
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div id="background"></div>


<!-- =====================================================
     STARS
===================================================== -->

<div id="stars"></div>


<!-- =====================================================
     METEORS
===================================================== -->

<div id="meteors"></div>


<!-- =====================================================
     TITLE
===================================================== -->

<div id="content">

    <div id="card">

        <h1>Ralkerie</h1>

        <p>Coming soon...</p>

    </div>

</div>


<script>

/* =====================================================
   STARS
===================================================== */

const starContainer =
    document.getElementById("stars");

const stars = [];


for (let i = 0; i < 200; i++) {

    const element =
        document.createElement("div");

    element.className =
        "star";


    const size =
        1 + Math.random() * 2;


    element.style.width =
        size + "px";

    element.style.height =
        size + "px";


    const star = {

        element: element,

        x:
            Math.random() *
            window.innerWidth,

        y:
            Math.random() *
            window.innerHeight,

        speed:
            20 +
            Math.random() * 50
    };


    element.style.left =
        star.x + "px";

    element.style.top =
        star.y + "px";


    starContainer.appendChild(
        element
    );


    stars.push(star);
}


/* =====================================================
   MOVE STARS RIGHT
===================================================== */

let starLastTime =
    performance.now();


function updateStars(time) {

    const delta =
        (time - starLastTime) / 1000;

    starLastTime =
        time;


    for (const star of stars) {

        /*
           MOVE RIGHT
        */

        star.x +=
            star.speed * delta;


        /*
           LOOP BACK TO LEFT
        */

        if (
            star.x >
            window.innerWidth + 10
        ) {

            star.x = -10;

            star.y =
                Math.random() *
                window.innerHeight;
        }


        star.element.style.left =
            star.x + "px";

        star.element.style.top =
            star.y + "px";
    }


    requestAnimationFrame(
        updateStars
    );
}


requestAnimationFrame(
    updateStars
);


/* =====================================================
   METEORS
===================================================== */

const meteorContainer =
    document.getElementById("meteors");

const meteors = [];


function createMeteor() {

    const element =
        document.createElement("div");

    element.className =
        "meteor";


    /*
       LONG + SKINNY
    */

    element.style.width =
        (
            450 +
            Math.random() * 350
        ) + "px";


    /*
       SPAWN ACROSS ENTIRE TOP

       X:
       0 → entire screen width

       Y:
       above screen
    */

    const x =
        Math.random() *
        window.innerWidth;

    const y =
        -100 -
        Math.random() * 500;


    /*
       FAST MOVEMENT

       RIGHT
       +
       DOWN
    */

    const velocityX =
        700 +
        Math.random() * 350;

    const velocityY =
        950 +
        Math.random() * 400;


    const meteor = {

        element: element,

        x: x,

        y: y,

        velocityX:
            velocityX,

        velocityY:
            velocityY
    };


    element.style.left =
        x + "px";

    element.style.top =
        y + "px";


    meteorContainer.appendChild(
        element
    );


    meteors.push(
        meteor
    );
}


/* =====================================================
   METEOR MOVEMENT
===================================================== */

let meteorLastTime =
    performance.now();


function updateMeteors(time) {

    const delta =
        (time - meteorLastTime) / 1000;

    meteorLastTime =
        time;


    for (
        let i = meteors.length - 1;
        i >= 0;
        i--
    ) {

        const meteor =
            meteors[i];


        /*
           MOVE RIGHT
        */

        meteor.x +=
            meteor.velocityX *
            delta;


        /*
           MOVE DOWN
        */

        meteor.y +=
            meteor.velocityY *
            delta;


        meteor.element.style.left =
            meteor.x + "px";

        meteor.element.style.top =
            meteor.y + "px";


        /*
           DESPAWN FAR OFFSCREEN
        */

        if (
            meteor.x >
                window.innerWidth + 700
            &&
            meteor.y >
                window.innerHeight + 700
        ) {

            meteor.element.remove();

            meteors.splice(
                i,
                1
            );
        }
    }


    requestAnimationFrame(
        updateMeteors
    );
}


requestAnimationFrame(
    updateMeteors
);


/* =====================================================
   SPAWN FOREVER
===================================================== */

function spawnMeteor() {

    createMeteor();


    setTimeout(
        spawnMeteor,

        100 +
        Math.random() * 150
    );
}


spawnMeteor();

</script>

</body>
</html>
