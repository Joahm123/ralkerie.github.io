<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ralkerie</title>


    <!-- =================================================
         FONT
    ================================================== -->

    <style>

        @font-face {

            font-family: "AndyB";

            src:
                url("./assets/fonts/ANDYB.TTF")
                format("truetype");

            font-weight: normal;

            font-style: normal;

            font-display: swap;
        }


        /* =================================================
           RESET
        ================================================== */

        * {

            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;

            height: 100%;

            margin: 0;

            padding: 0;
        }


        body {

            background: #050505;

            color: #ffffff;

            font-family:
                "AndyB",
                Arial,
                sans-serif;

            overflow: hidden;

            image-rendering: pixelated;
        }


        /* =================================================
           STARS
        ================================================== */

        #stars {

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        /* =================================================
           METEORS
           
           STARS = 0
           METEORS = 2
           WEBSITE = 10+
        ================================================== */

        #meteors {

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            overflow: hidden;

            pointer-events: none;

            z-index: 2;
        }


        /* =================================================
           NAVIGATION
        ================================================== */

        .pixel-tabs {

            position: fixed;

            top: 20px;

            right: 24px;

            display: flex;

            flex-direction: row;

            align-items: center;

            gap: 4px;

            padding: 5px;

            z-index: 1000;

            background: #000000;

            border:
                2px solid #1c1c1c;

            box-shadow:
                3px 3px 0 #000000;

            white-space: nowrap;
        }


        .pixel-tab {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            height: 36px;

            min-width: 68px;

            padding:
                0 13px;

            border: 0;

            background: #000000;

            color: #ffffff;

            font-family:
                "AndyB",
                Arial,
                sans-serif;

            font-size: 18px;

            cursor: pointer;

            box-shadow:
                inset 2px 2px 0 #222222,
                inset -2px -2px 0 #000000;
        }


        .pixel-tab:hover {

            background: #161616;
        }


        .pixel-tab.active {

            background: #0b0b0b;

            box-shadow:
                inset 0 -2px 0 #ffffff,
                inset 2px 2px 0 #292929;
        }


        /* =================================================
           MAIN
        ================================================== */

        main {

            position: relative;

            width: 100vw;

            height: 100vh;

            z-index: 10;
        }


        /* =================================================
           PAGES
        ================================================== */

        .pixel-page {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            width: 100vw;

            height: 100vh;

            padding:
                100px
                30px
                30px;

            z-index: 10;
        }


        .pixel-page.active {

            display: flex;
        }


        /* =================================================
           LIVE CONTENT
        ================================================== */

        .live-content {

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 18px;

            width: 100%;

            z-index: 20;
        }


        /* =================================================
           RALKERIE PNG
        ================================================== */

        .username-png {

            display: block;

            width: 340px;

            max-width: 75vw;

            height: auto;

            object-fit: contain;

            image-rendering: pixelated;

            user-select: none;

            pointer-events: none;

            position: relative;

            z-index: 30;
        }


        /* =================================================
           VISUALIZER AREA
        ================================================== */

        .waveform-wrapper {

            position: relative;

            width:
                min(
                    700px,
                    90vw
                );

            padding: 28px;

            z-index: 20;
        }


        /* =================================================
           VISUALIZER BARS CONTAINER
        ================================================== */

        .wave-border {

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 1;
        }


        /* =================================================
           INDIVIDUAL BAR
        ================================================== */

        .wave-bar {

            position: absolute;

            display: block;

            background:
                linear-gradient(
                    to bottom,
                    #ffffff 0%,
                    #ffffff 20%,
                    #ffb5e9 45%,
                    #ff72cf 75%,
                    #ff2db5 100%
                );

            box-shadow:
                0 0 3px #ffffff,
                0 0 6px #ff9bdd,
                0 0 10px rgba(
                    255,
                    45,
                    181,
                    0.8
                );

            opacity: 0.9;

            will-change:
                transform;
        }


        /* =================================================
           TOP / BOTTOM BARS
        ================================================== */

        .wave-bar.top,
        .wave-bar.bottom {

            width: 3px;

            transform-origin:
                center center;
        }


        .wave-bar.top {

            bottom: auto;
        }


        .wave-bar.bottom {

            top: auto;
        }


        /* =================================================
           LEFT / RIGHT BARS
        ================================================== */

        .wave-bar.left,
        .wave-bar.right {

            height: 3px;

            transform-origin:
                center center;
        }


        .wave-bar.left {

            right: auto;
        }


        .wave-bar.right {

            left: auto;
        }


        /* =================================================
           DISCORD CARD CONTAINER
        ================================================== */

        .discord-card-container {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            z-index: 5;
        }


        /* =================================================
           DISCORD CARD
        ================================================== */

        .discord-live-card {

            position: relative;

            width:
                min(
                    620px,
                    90vw
                );

            padding: 24px;

            background:
                rgba(
                    5,
                    5,
                    5,
                    0.96
                );

            border:
                2px solid #ffffff;

            box-shadow:
                6px 6px 0 #000000;

            z-index: 10;
        }


        /* =================================================
           DISCORD PROFILE
        ================================================== */

        .discord-profile {

            display: flex;

            align-items: center;

            gap: 18px;
        }


        .discord-avatar {

            width: 76px;

            height: 76px;

            object-fit: cover;

            image-rendering: pixelated;

            border:
                2px solid #ffffff;
        }


        .discord-name {

            font-size: 28px;

            color: #ffffff;
        }


        .discord-status {

            margin-top: 5px;

            font-size: 14px;
        }


        .status-online {

            color: #7cff7c;
        }


        .status-idle {

            color: #ffd65c;
        }


        .status-dnd {

            color: #ff6666;
        }


        .status-offline {

            color: #888888;
        }


        /* =================================================
           GAME ACTIVITY
        ================================================== */

        .discord-activity {

            margin-top: 24px;

            padding-top: 18px;

            border-top:
                2px solid #222222;
        }


        .discord-activity-title {

            font-size: 13px;

            color: #ff72cf;

            letter-spacing: 2px;
        }


        .discord-activity-text {

            margin-top: 6px;

            font-size: 22px;

            color: #ffffff;
        }


        /* =================================================
           SPOTIFY
        ================================================== */

        .discord-spotify {

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                2px solid #222222;
        }


        .discord-section-label {

            font-size: 13px;

            color: #ff72cf;

            letter-spacing: 2px;
        }


        .spotify-row {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-top: 10px;
        }


        .spotify-art {

            width: 58px;

            height: 58px;

            object-fit: cover;

            image-rendering: pixelated;
        }


        .spotify-song {

            font-size: 18px;

            color: #ffffff;
        }


        .spotify-artist {

            margin-top: 3px;

            font-size: 14px;

            color: #aaaaaa;
        }


        /* =================================================
           CLOCK
        ================================================== */

        .local-clock {

            margin-top: 24px;

            padding-top: 18px;

            border-top:
                2px solid #222222;

            text-align: center;
        }


        .clock-time {

            font-size: 32px;

            line-height: 1;

            color: #ffffff;

            text-shadow:
                3px 3px 0 #000000;
        }


        .clock-label {

            margin-top: 6px;

            font-size: 12px;

            letter-spacing: 2px;

            color: #ff72cf;
        }


        /* =================================================
           GENERAL PANELS
        ================================================== */

        .pixel-panel {

            position: relative;

            width:
                min(
                    700px,
                    85vw
                );

            padding: 35px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.82
                );

            border:
                2px solid #ffffff;

            box-shadow:
                6px 6px 0 #000000;

            text-align: center;

            z-index: 20;
        }


        .pixel-label {

            margin:
                0 0 8px;

            font-size: 18px;

            color: #aaaaaa;
        }


        .pixel-panel h1 {

            margin:
                0 0 15px;

            font-size:
                clamp(
                    36px,
                    5vw,
                    64px
                );

            font-weight: normal;

            color: #ffffff;

            text-shadow:
                3px 3px 0 #000000;
        }


        .pixel-description {

            margin: 0;

            color: #bdbdbd;

            font-size: 18px;

            line-height: 1.5;
        }


        /* =================================================
           MUSIC
        ================================================== */

        .music-card {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-top: 25px;

            padding: 12px;

            background: #080808;

            border:
                1px solid #333333;

            text-align: left;
        }


        .music-cover {

            width: 55px;

            height: 55px;

            flex-shrink: 0;

            background: #151515;

            border:
                1px solid #444444;
        }


        .music-info {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .music-info strong {

            color: #ffffff;

            font-size: 17px;
        }


        .music-info span {

            color: #888888;

            font-size: 15px;
        }


        /* =================================================
           LINKS
        ================================================== */

        .link-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 8px;

            margin-top: 25px;
        }


        .pixel-link {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 45px;

            background: #050505;

            border:
                1px solid #333333;

            color: #ffffff;

            text-decoration: none;

            font-size: 18px;
        }


        .pixel-link:hover {

            background: #171717;

            border-color: #ffffff;
        }


        /* =================================================
           MOBILE
        ================================================== */

        @media (max-width: 700px) {

            .pixel-tabs {

                top: 12px;

                right: 12px;

                left: 12px;

                max-width:
                    calc(
                        100vw - 24px
                    );

                overflow-x: auto;

                justify-content:
                    flex-start;
            }


            .pixel-tab {

                min-width: 55px;

                height: 32px;

                padding:
                    0 9px;

                font-size: 15px;
            }


            .pixel-page {

                padding:
                    80px
                    15px
                    20px;
            }


            .username-png {

                width: 270px;
            }


            .waveform-wrapper {

                width: 96vw;

                padding: 20px;
            }


            .discord-live-card {

                width: 92vw;

                padding: 18px;
            }


            .pixel-panel {

                width: 92vw;

                padding:
                    25px
                    18px;
            }


            .link-grid {

                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         STAR BACKGROUND
    ================================================== -->

    <div
        id="stars"
        aria-hidden="true"
    ></div>


    <!-- =================================================
         METEORS
    ================================================== -->

    <div
        id="meteors"
        aria-hidden="true"
    ></div>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <nav
        class="pixel-tabs"
        aria-label="Main navigation"
    >

        <button
            class="pixel-tab active"
            data-page="live"
            type="button"
        >
            LIVE
        </button>


        <button
            class="pixel-tab"
            data-page="music"
            type="button"
        >
            MUSIC
        </button>


        <button
            class="pixel-tab"
            data-page="links"
            type="button"
        >
            LINKS
        </button>


        <button
            class="pixel-tab"
            data-page="tools"
            type="button"
        >
            TOOLS
        </button>


        <button
            class="pixel-tab"
            data-page="about"
            type="button"
        >
            ABOUT
        </button>

    </nav>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main>


        <!-- =================================================
             LIVE
        ================================================== -->

        <section
            id="live"
            class="pixel-page active"
        >

            <div class="live-content">


                <!-- RALKERIE PNG -->

                <img
                    class="username-png"
                    src="./assets/images/username.png"
                    alt="Ralkerie"
                >


                <!-- =================================================
                     VISUALIZER + DISCORD
                ================================================== -->

                <div
                    class="waveform-wrapper"
                    id="waveform-wrapper"
                >

                    <!--
                        waveform.js automatically creates
                        the animated bars here.
                    -->

                    <div
                        class="discord-card-container"
                        id="discord-card-container"
                    >

                        <div class="discord-live-card">

                            Loading Discord...

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             MUSIC
        ================================================== -->

        <section
            id="music"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    MUSIC
                </p>


                <h1>
                    NOW PLAYING
                </h1>


                <div class="music-card">

                    <div
                        class="music-cover"
                    ></div>


                    <div class="music-info">

                        <strong>
                            No song playing
                        </strong>


                        <span>
                            Spotify
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             LINKS
        ================================================== -->

        <section
            id="links"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>


                <h1>
                    LINKS
                </h1>


                <div class="link-grid">


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        DISCORD
                    </a>


                    <a
                        href="https://github.com/Joahm123/ralkerie.github.io"
                        class="pixel-link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GITHUB
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        SPOTIFY
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        OTHER
                    </a>


                </div>

            </div>

        </section>


        <!-- =================================================
             TOOLS
        ================================================== -->

        <section
            id="tools"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>


                <h1>
                    TOOLS
                </h1>


                <p class="pixel-description">
                    Tools and projects will go here.
                </p>

            </div>

        </section>


        <!-- =================================================
             ABOUT
        ================================================== -->

        <section
            id="about"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>


                <h1>
                    ABOUT
                </h1>


                <p class="pixel-description">
                    Welcome to my little corner
                    of the internet.
                </p>

            </div>

        </section>


    </main>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="./js/stars.js"></script>

    <script src="./js/meteors.js"></script>

    <script src="./js/waveform.js"></script>

    <script src="./js/main.js"></script>

    <script src="./js/discord.js"></script>


</body>

</html>
