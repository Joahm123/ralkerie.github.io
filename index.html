```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ralkerie</title>


    <!-- =================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/main.css"
    >

    <link
        rel="stylesheet"
        href="./css/background.css"
    >

    <link
        rel="stylesheet"
        href="./css/meteors.css"
    >

    <link
        rel="stylesheet"
        href="./css/waveform.css"
    >

</head>


<body>


    <!-- =================================================
         BACKGROUND
    ================================================== -->

    <div
        id="stars"
        aria-hidden="true"
    ></div>


    <div
        id="meteors"
        aria-hidden="true"
    ></div>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <nav
        class="pixel-tabs"
        aria-label="Main navigation"
    >

        <button
            class="pixel-tab active"
            data-page="live"
            type="button"
        >
            LIVE
        </button>


        <button
            class="pixel-tab"
            data-page="music"
            type="button"
        >
            MUSIC
        </button>


        <button
            class="pixel-tab"
            data-page="links"
            type="button"
        >
            LINKS
        </button>


        <button
            class="pixel-tab"
            data-page="tools"
            type="button"
        >
            TOOLS
        </button>


        <button
            class="pixel-tab"
            data-page="about"
            type="button"
        >
            ABOUT
        </button>

    </nav>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main>


        <!-- =============================================
             LIVE
        ============================================== -->

        <section
            id="live"
            class="pixel-page active"
        >

            <!-- Discord.js replaces this
                 with the live Discord card -->

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    LIVE
                </h1>

                <p class="pixel-description">
                    Loading Discord...
                </p>

            </div>

        </section>


        <!-- =============================================
             MUSIC
        ============================================== -->

        <section
            id="music"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    MUSIC
                </p>

                <h1>
                    NOW PLAYING
                </h1>


                <div
                    id="music-card"
                    class="music-card"
                >

                    <div
                        class="music-cover"
                    ></div>


                    <div
                        class="music-info"
                    >

                        <strong>
                            No song playing
                        </strong>

                        <span>
                            Spotify
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- =============================================
             LINKS
        ============================================== -->

        <section
            id="links"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    LINKS
                </h1>


                <div class="link-grid">

                    <a
                        href="#"
                        class="pixel-link"
                    >
                        DISCORD
                    </a>


                    <a
                        href="https://github.com/Joahm123/ralkerie.github.io"
                        class="pixel-link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GITHUB
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        SPOTIFY
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        OTHER
                    </a>

                </div>

            </div>

        </section>


        <!-- =============================================
             TOOLS
        ============================================== -->

        <section
            id="tools"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    TOOLS
                </h1>

                <p class="pixel-description">
                    Tools and projects will go here.
                </p>

            </div>

        </section>


        <!-- =============================================
             ABOUT
        ============================================== -->

        <section
            id="about"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    ABOUT
                </h1>

                <p class="pixel-description">
                    Welcome to my little corner
                    of the internet.
                </p>

            </div>

        </section>


    </main>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script
        src="./js/stars.js"
    ></script>


    <script
        src="./js/meteors.js"
    ></script>


    <script
        src="./js/waveform.js"
    ></script>


    <script
        src="./js/main.js"
    ></script>


    <!-- Discord.js also creates
         and updates the local clock -->

    <script
        src="./js/discord.js"
    ></script>


</body>

</html>
```
