<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ralkerie</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050207;
    color: white;
    font-family: Arial, sans-serif;
}


/* =========================
   SPACE BACKGROUND
========================= */

#background {
    position: fixed;
    inset: 0;
    z-index: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            #35152f 0%,
            #1d0b1c 35%,
            #0b040d 70%,
            #020103 100%
        );
}

#background::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 15% 50%,
            rgba(255, 40, 190, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(255, 90, 220, 0.13),
            transparent 35%
        );
}


/* =========================
   STARS
========================= */

#stars {
    position: fixed;
    inset: 0;
    z-index: 1;

    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;

    border-radius: 50%;
    background: white;

    box-shadow:
        0 0 4px white,
        0 0 9px rgba(255, 180, 235, 0.8);

    will-change: transform;
}


/* =========================
   METEOR LAYER
========================= */

#meteors {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: visible;

    z-index: 2;
    pointer-events: none;
}


/* =========================
   METEOR
========================= */

.meteor {
    position: absolute;

    height: 11px;

    border-radius: 999px;

    transform-origin: right center;
    transform: rotate(46deg);

    background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255, 30, 180, 0.04) 20%,
        rgba(255, 60, 200, 0.18) 55%,
        rgba(255, 140, 230, 0.7) 88%,
        white 100%
    );

    box-shadow:
        0 0 10px rgba(255, 130, 225, 1),
        0 0 25px rgba(255, 60, 200, 0.8),
        0 0 55px rgba(255, 40, 190, 0.5);

    will-change: left, top;
}


/* =========================
   METEOR TRAIL
========================= */

.meteor::before {
    content: "";

    position: absolute;

    right: 0;
    top: 50%;

    width: 1000px;
    height: 36px;

    transform: translateY(-50%);

    border-radius: 999px;

    background: linear-gradient(
        to right,
        transparent,
        rgba(255, 20, 180, 0.03),
        rgba(255, 50, 195, 0.12),
        rgba(255, 90, 215, 0.3),
        rgba(255, 160, 235, 0.6)
    );

    filter: blur(15px);
}


/* =========================
   METEOR HEAD
========================= */

.meteor::after {
    content: "";

    position: absolute;

    right: -8px;
    top: 50%;

    width: 24px;
    height: 24px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 25px #ffd6f5,
        0 0 45px #ff8bd8,
        0 0 75px #ff35bd,
        0 0 110px rgba(255, 40, 190, 0.8);
}


/* =========================
   TITLE
========================= */

#content {
    position: fixed;
    inset: 0;

    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

#card {
    padding: 45px 70px;

    min-width: 320px;

    text-align: center;

    background: rgba(8, 3, 12, 0.78);

    border: 1px solid rgba(255, 180, 235, 0.22);

    border-radius: 24px;

    box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.8),
        0 0 70px rgba(255, 50, 190, 0.12);

    backdrop-filter: blur(18px);
}

#card h1 {
    font-size: clamp(48px, 7vw, 90px);
    letter-spacing: 3px;

    text-shadow:
        0 0 15px rgba(255, 160, 230, 0.4),
        0 0 40px rgba(255, 60, 190, 0.2);
}

#card p {
    margin-top: 12px;

    color: rgba(255, 210, 240, 0.75);

    font-size: 18px;
    letter-spacing: 2px;
}
</style>
</head>


<body>

<div id="background"></div>

<div id="stars"></div>

<div id="meteors"></div>

<div id="content">
    <div id="card">
        <h1>Ralkerie</h1>
        <p>Coming soon...</p>
    </div>
</div>


<script>

/* =====================================================
   STARS
===================================================== */

const starContainer =
    document.getElementById("stars");

const stars = [];

for (let i = 0; i < 250; i++) {

    const element =
        document.createElement("div");

    element.className = "star";

    const size =
        1 + Math.random() * 2;

    element.style.width =
        size + "px";

    element.style.height =
        size + "px";


    stars.push({
        element: element,

        x: Math.random() * window.innerWidth,

        y: Math.random() * window.innerHeight,

        speed: 15 + Math.random() * 45
    });


    starContainer.appendChild(element);
}


/* =====================================================
   MOVING STARS
===================================================== */

let previousTime = performance.now();

function moveStars(time) {

    const delta =
        (time - previousTime) / 1000;

    previousTime = time;


    for (const star of stars) {

        star.x += star.speed * delta;


        if (star.x > window.innerWidth + 20) {
            star.x = -20;
        }


        star.element.style.left =
            star.x + "px";

        star.element.style.top =
            star.y + "px";
    }


    requestAnimationFrame(moveStars);
}

requestAnimationFrame(moveStars);


/* =====================================================
   METEORS
===================================================== */

const meteorContainer =
    document.getElementById("meteors");

const meteorList = [];


/*
    THIS IS THE SPAWN BOX:

             -500px
                ↓

       ┌─────────────────────────────┐
       │                             │
       │   METEOR SPAWN AREA         │
       │                             │
       └─────────────────────────────┘
       ↑                           ↑
    -500px                    screen + 500px

    BUT THE Y POSITION IS ALWAYS
    ABOVE THE SCREEN.

    X = ANYWHERE across the box.
*/


function createMeteor() {

    const element =
        document.createElement("div");

    element.className =
        "meteor";


    /* Long skinny meteor */

    const length =
        450 +
        Math.random() * 350;

    element.style.width =
        length + "px";


    /*
        =====================================
        ACTUAL SPAWN COORDINATES
        =====================================

        X:

        -500 → screen width + 500

        Y:

        -500 → -100

        Therefore it ALWAYS comes
        from above.
    */

    const x =
        -500 +
        Math.random() *
        (window.innerWidth + 1000);

    const y =
        -500 +
        Math.random() * 400;


    /*
        Actual movement velocity.

        POSITIVE X = RIGHT
        POSITIVE Y = DOWN

        No CSS animation.
        No transform movement.
    */

    const velocityX =
        450 +
        Math.random() * 350;

    const velocityY =
        650 +
        Math.random() * 350;


    const meteor = {

        element: element,

        x: x,

        y: y,

        velocityX: velocityX,

        velocityY: velocityY
    };


    /*
        Set initial position.
    */

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";


    meteorContainer.appendChild(
        element
    );


    meteorList.push(
        meteor
    );
}


/* =====================================================
   METEOR PHYSICS
===================================================== */

let meteorTimer = 0;

let lastMeteorTime =
    performance.now();


function updateMeteors(time) {

    const delta =
        (time - lastMeteorTime) / 1000;

    lastMeteorTime = time;


    /*
        Move every meteor.
    */

    for (
        let i = meteorList.length - 1;
        i >= 0;
        i--
    ) {

        const meteor =
            meteorList[i];


        /*
            RIGHT
        */

        meteor.x +=
            meteor.velocityX *
            delta;


        /*
            DOWN
        */

        meteor.y +=
            meteor.velocityY *
            delta;


        /*
            ACTUAL POSITION
        */

        meteor.element.style.left =
            meteor.x + "px";

        meteor.element.style.top =
            meteor.y + "px";


        /*
            DESPAWN BOX

            Meteor isn't removed when
            it leaves the screen.

            It has to travel another
            500px outside.
        */

        const outsideRight =
            meteor.x >
            window.innerWidth + 500;

        const outsideBottom =
            meteor.y >
            window.innerHeight + 500;


        if (
            outsideRight ||
            outsideBottom
        ) {

            meteor.element.remove();

            meteorList.splice(i, 1);
        }
    }


    /*
        Keep spawning forever.
    */

    meteorTimer += delta;


    if (meteorTimer >= 0.16) {

        meteorTimer = 0;

        createMeteor();
    }


    requestAnimationFrame(
        updateMeteors
    );
}


/* Start meteors */

requestAnimationFrame(
    updateMeteors
);

</script>

</body>
</html>
