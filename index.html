<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ralkerie</title>

    <style>

        @font-face {
            font-family: "AndyB";
            src: url("./assets/fonts/ANDYB.TTF") format("truetype");
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: white;
            font-family: "AndyB", Arial, sans-serif;
            overflow: hidden;
            image-rendering: pixelated;
        }

        #stars {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        #meteors {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* =========================
           NAV
        ========================= */

        .pixel-tabs {
            position: fixed;
            top: 20px;
            right: 24px;

            display: flex;
            align-items: center;

            gap: 4px;
            padding: 5px;

            z-index: 1000;

            background: #000;
            border: 2px solid #1c1c1c;

            box-shadow: 3px 3px 0 #000;

            white-space: nowrap;
        }

        .pixel-tab {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 36px;
            min-width: 68px;

            padding: 0 13px;

            border: 0;
            background: #000;
            color: #fff;

            font-family: "AndyB", Arial, sans-serif;
            font-size: 18px;

            cursor: pointer;

            box-shadow:
                inset 2px 2px 0 #222,
                inset -2px -2px 0 #000;
        }

        .pixel-tab:hover {
            background: #161616;
        }

        .pixel-tab.active {
            background: #0b0b0b;

            box-shadow:
                inset 0 -2px 0 #fff,
                inset 2px 2px 0 #292929;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            position: relative;

            width: 100vw;
            height: 100vh;

            z-index: 10;
        }

        .pixel-page {
            position: fixed;
            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            width: 100vw;
            height: 100vh;

            padding: 100px 30px 30px;
        }

        .pixel-page.active {
            display: flex;
        }

        /* =========================
           LIVE
        ========================= */

        .live-content {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 28px;

            width: 100%;
        }

        /* BIG PNG */

        .username-png {
            display: block;

            width: 560px;
            max-width: 85vw;

            height: auto;

            object-fit: contain;

            image-rendering: pixelated;

            user-select: none;
            pointer-events: none;
        }

        /* DISCORD CONTAINER */

        .discord-card-container {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            flex-shrink: 0;
        }

        /* IMPORTANT:
           LARGE HORIZONTAL BOX */

        .waveform-wrapper {
            position: relative;

            width: 700px;
            max-width: 88vw;

            flex-shrink: 0;

            z-index: 20;
        }

        /* DISCORD CARD */

        .discord-live-card {
            position: relative;

            width: 100%;

            min-height: 260px;

            padding: 26px;

            background: rgba(5, 5, 5, 0.94);

            border: 2px solid #fff;

            box-shadow: 6px 6px 0 #000;

            z-index: 10;
        }

        /* =========================
           PROFILE
        ========================= */

        .discord-profile {
            display: flex;

            align-items: center;

            gap: 18px;
        }

        .discord-avatar {
            width: 82px;
            height: 82px;

            object-fit: cover;

            image-rendering: pixelated;

            border: 2px solid #fff;
        }

        .discord-name {
            font-size: 30px;
            color: #fff;
        }

        .discord-status {
            margin-top: 5px;
            font-size: 15px;
        }

        .status-online {
            color: #7cff7c;
        }

        .status-idle {
            color: #ffd65c;
        }

        .status-dnd {
            color: #ff6666;
        }

        .status-offline {
            color: #888;
        }

        /* =========================
           GAME
        ========================= */

        .discord-activity {
            margin-top: 24px;
            padding-top: 18px;

            border-top: 2px solid #222;
        }

        .discord-activity-title {
            font-size: 13px;
            color: #ff72cf;
            letter-spacing: 2px;
        }

        .discord-activity-text {
            margin-top: 6px;

            font-size: 22px;
            color: #fff;
        }

        /* =========================
           SPOTIFY
        ========================= */

        .discord-spotify {
            margin-top: 20px;
            padding-top: 18px;

            border-top: 2px solid #222;
        }

        .discord-section-label {
            font-size: 13px;
            color: #ff72cf;
            letter-spacing: 2px;
        }

        .spotify-row {
            display: flex;
            align-items: center;

            gap: 14px;
            margin-top: 10px;
        }

        .spotify-art {
            width: 58px;
            height: 58px;

            object-fit: cover;

            image-rendering: pixelated;
        }

        .spotify-song {
            font-size: 18px;
            color: #fff;
        }

        .spotify-artist {
            margin-top: 3px;

            font-size: 14px;
            color: #aaa;
        }

        /* =========================
           CLOCK
        ========================= */

        .local-clock {
            margin-top: 24px;
            padding-top: 18px;

            border-top: 2px solid #222;

            text-align: center;
        }

        .clock-time {
            font-size: 32px;
            line-height: 1;

            color: #fff;

            text-shadow: 3px 3px 0 #000;
        }

        .clock-label {
            margin-top: 6px;

            font-size: 12px;
            letter-spacing: 2px;

            color: #ff72cf;
        }

        /* =========================
           OTHER PAGES
        ========================= */

        .pixel-panel {
            position: relative;

            width: min(700px, 85vw);

            padding: 35px;

            background: rgba(0, 0, 0, 0.82);

            border: 2px solid #fff;

            box-shadow: 6px 6px 0 #000;

            text-align: center;
        }

        .pixel-label {
            margin: 0 0 8px;

            font-size: 18px;
            color: #aaa;
        }

        .pixel-panel h1 {
            margin: 0 0 15px;

            font-size: clamp(36px, 5vw, 64px);

            font-weight: normal;

            color: #fff;

            text-shadow: 3px 3px 0 #000;
        }

        .pixel-description {
            margin: 0;

            color: #bdbdbd;

            font-size: 18px;
            line-height: 1.5;
        }

        .music-card {
            display: flex;
            align-items: center;

            gap: 15px;
            margin-top: 25px;
            padding: 12px;

            background: #080808;

            border: 1px solid #333;

            text-align: left;
        }

        .music-cover {
            width: 55px;
            height: 55px;

            flex-shrink: 0;

            background: #151515;

            border: 1px solid #444;
        }

        .music-info {
            display: flex;
            flex-direction: column;

            gap: 5px;
        }

        .music-info strong {
            color: #fff;
            font-size: 17px;
        }

        .music-info span {
            color: #888;
            font-size: 15px;
        }

        .link-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 8px;

            margin-top: 25px;
        }

        .pixel-link {
            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 45px;

            background: #050505;

            border: 1px solid #333;

            color: #fff;

            text-decoration: none;

            font-size: 18px;
        }

        .pixel-link:hover {
            background: #171717;
            border-color: #fff;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .pixel-tabs {
                top: 12px;
                right: 12px;
                left: 12px;

                max-width:
                    calc(100vw - 24px);

                overflow-x: auto;

                justify-content: flex-start;
            }

            .pixel-tab {
                min-width: 55px;

                height: 32px;

                padding: 0 9px;

                font-size: 15px;
            }

            .pixel-page {
                padding:
                    80px
                    15px
                    20px;
            }

            .live-content {
                gap: 20px;
            }

            .username-png {
                width: 450px;
                max-width: 92vw;
            }

            .waveform-wrapper {
                width: 92vw;
                max-width: 92vw;
            }

            .discord-live-card {
                min-height: 240px;
                padding: 20px;
            }

            .discord-avatar {
                width: 70px;
                height: 70px;
            }

            .discord-name {
                font-size: 25px;
            }

            .pixel-panel {
                width: 92vw;
                padding: 25px 18px;
            }

            .link-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

    <link
        rel="stylesheet"
        href="./css/main.css"
    >

    <link
        rel="stylesheet"
        href="./css/background.css"
    >

    <link
        rel="stylesheet"
        href="./css/meteors.css"
    >

    <link
        rel="stylesheet"
        href="./css/waveform.css"
    >

</head>


<body>

    <div
        id="stars"
        aria-hidden="true"
    ></div>

    <div
        id="meteors"
        aria-hidden="true"
    ></div>


    <nav
        class="pixel-tabs"
        aria-label="Main navigation"
    >

        <button
            class="pixel-tab active"
            data-page="live"
            type="button"
        >
            LIVE
        </button>

        <button
            class="pixel-tab"
            data-page="music"
            type="button"
        >
            MUSIC
        </button>

        <button
            class="pixel-tab"
            data-page="links"
            type="button"
        >
            LINKS
        </button>

        <button
            class="pixel-tab"
            data-page="tools"
            type="button"
        >
            TOOLS
        </button>

        <button
            class="pixel-tab"
            data-page="about"
            type="button"
        >
            ABOUT
        </button>

    </nav>


    <main>

        <!-- LIVE -->

        <section
            id="live"
            class="pixel-page active"
        >

            <div class="live-content">

                <img
                    class="username-png"
                    src="./assets/images/username.png"
                    alt="Ralkerie"
                >

                <div
                    id="discord-card-container"
                    class="discord-card-container"
                >

                    <div class="discord-live-card">

                        Loading Discord...

                    </div>

                </div>

            </div>

        </section>


        <!-- MUSIC -->

        <section
            id="music"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    MUSIC
                </p>

                <h1>
                    NOW PLAYING
                </h1>

                <div class="music-card">

                    <div class="music-cover"></div>

                    <div class="music-info">

                        <strong>
                            No song playing
                        </strong>

                        <span>
                            Spotify
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- LINKS -->

        <section
            id="links"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    LINKS
                </h1>

                <div class="link-grid">

                    <a
                        href="#"
                        class="pixel-link"
                    >
                        DISCORD
                    </a>

                    <a
                        href="https://github.com/Joahm123/ralkerie.github.io"
                        class="pixel-link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GITHUB
                    </a>

                    <a
                        href="#"
                        class="pixel-link"
                    >
                        SPOTIFY
                    </a>

                    <a
                        href="#"
                        class="pixel-link"
                    >
                        OTHER
                    </a>

                </div>

            </div>

        </section>


        <!-- TOOLS -->

        <section
            id="tools"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    TOOLS
                </h1>

                <p class="pixel-description">
                    Tools and projects will go here.
                </p>

            </div>

        </section>


        <!-- ABOUT -->

        <section
            id="about"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    ABOUT
                </h1>

                <p class="pixel-description">
                    Welcome to my little corner
                    of the internet.
                </p>

            </div>

        </section>

    </main>


    <script src="./js/stars.js"></script>

    <script src="./js/meteors.js"></script>

    <script src="./js/main.js"></script>

    <script src="./js/discord.js"></script>

    <script src="./js/waveform.js"></script>

</body>

</html>
