<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ralkerie</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050208;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   SPACE BACKGROUND
===================================================== */

#background {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #351431 0%,
            #1c0a1c 35%,
            #0b040d 70%,
            #020103 100%
        );

    z-index: 0;
}

#background::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 15% 45%,
            rgba(255, 40, 190, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(255, 90, 210, 0.13),
            transparent 35%
        );
}


/* =====================================================
   STARS
===================================================== */

#stars {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}

.star {
    position: absolute;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 4px white,
        0 0 9px rgba(255, 180, 235, 0.8);

    /*
       TWO ANIMATIONS:

       1. starTravel = moves across screen
       2. starTwinkle = sparkles
    */

    animation:
        starTravel linear infinite,
        starTwinkle ease-in-out infinite;
}


@keyframes starTravel {

    from {
        transform: translateX(-100px);
    }

    to {
        transform: translateX(110vw);
    }
}


@keyframes starTwinkle {

    0% {
        opacity: 0.25;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.25;
    }
}


/* =====================================================
   METEORS
===================================================== */

#meteors {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    /*
       IMPORTANT:

       The container itself is NOT moved.

       Meteors can exist outside the viewport
       because overflow is visible.
    */

    overflow: visible;

    pointer-events: none;

    z-index: 2;
}


.meteor {
    position: absolute;

    height: 10px;

    border-radius: 999px;

    /*
       Meteor points RIGHT.
    */

    background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255, 30, 180, 0.04) 20%,
        rgba(255, 60, 200, 0.18) 55%,
        rgba(255, 140, 230, 0.65) 88%,
        white 100%
    );

    box-shadow:
        0 0 10px rgba(255, 130, 225, 0.9),
        0 0 25px rgba(255, 60, 200, 0.8),
        0 0 55px rgba(255, 40, 190, 0.5);

    /*
       46 DEGREE DIAGONAL
    */

    transform-origin: right center;
}


/* =====================================================
   LONG PINK TRAIL
===================================================== */

.meteor::before {
    content: "";

    position: absolute;

    right: 0;
    top: 50%;

    width: 1100px;
    height: 34px;

    transform: translateY(-50%);

    border-radius: 999px;

    background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255, 20, 180, 0.01) 20%,
        rgba(255, 40, 190, 0.08) 45%,
        rgba(255, 80, 210, 0.25) 75%,
        rgba(255, 160, 235, 0.55) 100%
    );

    filter: blur(15px);

    pointer-events: none;
}


/* =====================================================
   METEOR HEAD
===================================================== */

.meteor::after {
    content: "";

    position: absolute;

    right: -7px;
    top: 50%;

    width: 23px;
    height: 23px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 25px #ffd6f5,
        0 0 45px #ff8bd8,
        0 0 75px #ff35bd,
        0 0 110px rgba(255, 40, 190, 0.8);
}


/* =====================================================
   METEOR MOVEMENT
===================================================== */

@keyframes meteorTravel {

    /*
       Starts above the screen.
    */

    0% {
        transform:
            translate(0, 0)
            rotate(46deg);

        opacity: 0;
    }


    /*
       Appears while entering from top.
    */

    8% {
        opacity: 1;
    }


    /*
       Crosses the screen.
    */

    85% {
        opacity: 1;
    }


    /*
       Goes WAY beyond the screen.

       This is the actual despawn area.
    */

    100% {
        transform:
            translate(
                120vw,
                150vh
            )
            rotate(46deg);

        opacity: 0;
    }
}


/* =====================================================
   TITLE
===================================================== */

#content {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 10;

    pointer-events: none;
}


#card {
    padding: 45px 70px;

    text-align: center;

    background: rgba(8, 3, 12, 0.78);

    border: 1px solid rgba(255, 180, 235, 0.22);

    border-radius: 24px;

    box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.8),
        0 0 70px rgba(255, 50, 190, 0.12);

    backdrop-filter: blur(18px);
}


#card h1 {
    font-size: clamp(48px, 7vw, 90px);

    color: white;

    letter-spacing: 3px;

    text-shadow:
        0 0 15px rgba(255, 160, 230, 0.4),
        0 0 40px rgba(255, 60, 190, 0.2);
}


#card p {
    margin-top: 12px;

    color: rgba(255, 210, 240, 0.75);

    font-size: 18px;

    letter-spacing: 2px;
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div id="background"></div>


<!-- =====================================================
     STARS
===================================================== -->

<div id="stars"></div>


<!-- =====================================================
     METEORS
===================================================== -->

<div id="meteors"></div>


<!-- =====================================================
     TITLE
===================================================== -->

<div id="content">

    <div id="card">

        <h1>Ralkerie</h1>

        <p>Coming soon...</p>

    </div>

</div>


<script>


/* =====================================================
   STARS
===================================================== */

const starsContainer =
    document.getElementById("stars");


for (let i = 0; i < 250; i++) {

    const star =
        document.createElement("div");

    star.className = "star";


    const size =
        1 + Math.random() * 2;


    star.style.width =
        size + "px";

    star.style.height =
        size + "px";


    /*
       Start randomly across the
       entire screen.
    */

    star.style.left =
        Math.random() * 100 + "vw";

    star.style.top =
        Math.random() * 100 + "vh";


    /*
       Movement speed.
    */

    star.style.animationDuration =
        (8 + Math.random() * 12) + "s, " +
        (2 + Math.random() * 3) + "s";


    /*
       Random starting point in
       the animation.
    */

    star.style.animationDelay =
        (Math.random() * -20) + "s, " +
        (Math.random() * -5) + "s";


    starsContainer.appendChild(star);
}



/* =====================================================
   METEORS
===================================================== */

const meteorContainer =
    document.getElementById("meteors");


function createMeteor() {

    const meteor =
        document.createElement("div");


    meteor.className =
        "meteor";


    /* ---------------------------------------------
       LONG + SKINNY
    --------------------------------------------- */

    const length =
        450 +
        Math.random() * 350;


    meteor.style.width =
        length + "px";


    /* ---------------------------------------------
       SPAWN X

       THIS IS THE IMPORTANT PART.

       The meteor can spawn ANYWHERE across
       the ENTIRE TOP OF THE SCREEN.

       0px = far left
       window.innerWidth = far right

       No bias.
       No shifted container.
       No "-500px".
    --------------------------------------------- */

    const startX =
        Math.random() *
        window.innerWidth;


    /* ---------------------------------------------
       SPAWN Y

       ALWAYS ABOVE THE SCREEN.

       It cannot spawn in the middle.
       It cannot spawn on the sides.
       It cannot spawn at the bottom.
    --------------------------------------------- */

    const startY =
        -200 -
        Math.random() * 600;


    meteor.style.left =
        startX + "px";


    meteor.style.top =
        startY + "px";


    /* ---------------------------------------------
       SPEED
    --------------------------------------------- */

    const duration =
        1.3 +
        Math.random() * 0.6;


    meteor.style.animation =
        "meteorTravel " +
        duration +
        "s linear forwards";


    meteorContainer.appendChild(
        meteor
    );


    /* ---------------------------------------------
       DESPAWN

       Wait until AFTER the animation has
       traveled completely offscreen.
    --------------------------------------------- */

    setTimeout(
        function () {

            meteor.remove();

        },
        duration * 1000 + 1000
    );
}



/* =====================================================
   CONTINUOUS METEORS
===================================================== */

function spawnMeteor() {

    createMeteor();


    const nextSpawn =
        130 +
        Math.random() * 220;


    setTimeout(
        spawnMeteor,
        nextSpawn
    );
}


/* START METEORS */

spawnMeteor();


</script>

</body>
</html>
