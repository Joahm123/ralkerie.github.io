<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ralkerie</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050208;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   BACKGROUND
===================================================== */

#background {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;

    background:
        radial-gradient(
            ellipse at center,
            #35152f 0%,
            #1d0b1c 35%,
            #0b040d 70%,
            #020103 100%
        );

    z-index: 0;
}


/* =====================================================
   STARS
===================================================== */

#stars {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    z-index: 1;

    pointer-events: none;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px white,
        0 0 10px rgba(255, 180, 235, 0.9);
}


/* =====================================================
   METEORS
===================================================== */

#meteors {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: visible;

    z-index: 2;

    pointer-events: none;
}

.meteor {
    position: absolute;

    height: 10px;

    border-radius: 999px;

    background: linear-gradient(
        to right,
        transparent,
        rgba(255, 50, 195, 0.15),
        rgba(255, 110, 220, 0.6),
        white
    );

    box-shadow:
        0 0 12px rgba(255, 120, 225, 1),
        0 0 30px rgba(255, 50, 200, 0.8),
        0 0 60px rgba(255, 30, 190, 0.5);

    transform: rotate(46deg);

    transform-origin: right center;
}

.meteor::before {
    content: "";

    position: absolute;

    right: 0;
    top: 50%;

    width: 1000px;
    height: 35px;

    transform: translateY(-50%);

    border-radius: 999px;

    background: linear-gradient(
        to right,
        transparent,
        rgba(255, 30, 180, 0.05),
        rgba(255, 80, 210, 0.25),
        rgba(255, 170, 240, 0.6)
    );

    filter: blur(15px);
}

.meteor::after {
    content: "";

    position: absolute;

    right: -8px;
    top: 50%;

    width: 23px;
    height: 23px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 25px #ffd6f5,
        0 0 45px #ff8bd8,
        0 0 75px #ff35bd;
}


/* =====================================================
   TITLE
===================================================== */

#content {
    position: fixed;
    inset: 0;

    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

#card {
    padding: 45px 70px;

    background: rgba(8, 3, 12, 0.8);

    border: 1px solid rgba(255, 180, 235, 0.2);

    border-radius: 24px;

    text-align: center;

    box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(255, 50, 190, 0.12);
}

#card h1 {
    font-size: clamp(48px, 7vw, 90px);

    letter-spacing: 3px;
}

#card p {
    margin-top: 12px;

    color: rgba(255, 210, 240, 0.75);

    font-size: 18px;
}

</style>
</head>

<body>

<div id="background"></div>

<div id="stars"></div>

<div id="meteors"></div>

<div id="content">
    <div id="card">
        <h1>Ralkerie</h1>
        <p>Coming soon...</p>
    </div>
</div>


<script>

/* =====================================================
   STARS

   They physically move RIGHT.
===================================================== */

const starContainer =
    document.getElementById("stars");

const stars = [];

for (let i = 0; i < 200; i++) {

    const element =
        document.createElement("div");

    element.className = "star";

    const star = {

        element: element,

        x:
            Math.random() *
            window.innerWidth,

        y:
            Math.random() *
            window.innerHeight,

        speed:
            20 +
            Math.random() * 50
    };

    element.style.left =
        star.x + "px";

    element.style.top =
        star.y + "px";

    starContainer.appendChild(element);

    stars.push(star);
}


let starLastTime =
    performance.now();


function updateStars(time) {

    const delta =
        (time - starLastTime) / 1000;

    starLastTime = time;


    for (const star of stars) {

        /*
            MOVE RIGHT
        */

        star.x +=
            star.speed * delta;


        /*
            WHEN IT LEAVES RIGHT SIDE,
            PUT IT BACK ON LEFT.
        */

        if (
            star.x >
            window.innerWidth + 10
        ) {

            star.x = -10;

            star.y =
                Math.random() *
                window.innerHeight;
        }


        star.element.style.left =
            star.x + "px";

        star.element.style.top =
            star.y + "px";
    }


    requestAnimationFrame(
        updateStars
    );
}


requestAnimationFrame(
    updateStars
);


/* =====================================================
   METEORS

   ABSOLUTE RULE:

   X = 0 → SCREEN WIDTH

   Y = ABOVE SCREEN

   NOTHING ELSE.
===================================================== */

const meteorContainer =
    document.getElementById("meteors");

const meteors = [];


function createMeteor() {

    const element =
        document.createElement("div");

    element.className =
        "meteor";


    /*
        LONG
    */

    element.style.width =
        (450 +
        Math.random() * 350) +
        "px";


    /*
        =====================================
        SPAWN

        X IS BETWEEN:

        LEFT EDGE OF SCREEN
        AND
        RIGHT EDGE OF SCREEN

        EXACTLY.

        NO NEGATIVE X.
        NO +500.
        NO OFFSET.
    =====================================
    */

    const x =
        Math.random() *
        window.innerWidth;


    /*
        Y IS ABOVE SCREEN.

        -100 to -600px.
    */

    const y =
        -100 -
        Math.random() * 500;


    /*
        =====================================
        MOVEMENT

        RIGHT + DOWN

        This is gravity-like.
    =====================================
    */

    const velocityX =
        350 +
        Math.random() * 250;

    const velocityY =
        500 +
        Math.random() * 300;


    const meteor = {

        element: element,

        x: x,

        y: y,

        velocityX: velocityX,

        velocityY: velocityY
    };


    element.style.left =
        x + "px";

    element.style.top =
        y + "px";


    meteorContainer.appendChild(
        element
    );

    meteors.push(
        meteor
    );
}


/* =====================================================
   METEOR MOVEMENT
===================================================== */

let meteorLastTime =
    performance.now();


function updateMeteors(time) {

    const delta =
        (time - meteorLastTime) / 1000;

    meteorLastTime = time;


    for (
        let i = meteors.length - 1;
        i >= 0;
        i--
    ) {

        const meteor =
            meteors[i];


        /*
            RIGHT
        */

        meteor.x +=
            meteor.velocityX *
            delta;


        /*
            DOWN
        */

        meteor.y +=
            meteor.velocityY *
            delta;


        meteor.element.style.left =
            meteor.x + "px";

        meteor.element.style.top =
            meteor.y + "px";


        /*
            DESPAWN ONLY AFTER
            IT IS FAR OFFSCREEN.
        */

        if (
            meteor.x >
                window.innerWidth + 700
            &&
            meteor.y >
                window.innerHeight + 700
        ) {

            meteor.element.remove();

            meteors.splice(
                i,
                1
            );
        }
    }


    requestAnimationFrame(
        updateMeteors
    );
}


requestAnimationFrame(
    updateMeteors
);


/* =====================================================
   SPAWN METEORS FOREVER
===================================================== */

function spawnMeteor() {

    createMeteor();

    setTimeout(
        spawnMeteor,
        120 +
        Math.random() * 180
    );
}


spawnMeteor();

</script>

</body>
</html>
