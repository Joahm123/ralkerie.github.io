<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ralkerie</title>


    <style>

        @font-face {

            font-family: "AndyB";

            src: url("./assets/fonts/ANDYB.TTF")
                format("truetype");

            font-weight: normal;
            font-style: normal;

            font-display: swap;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;
        }


        body {

            background: #050505;

            color: #ffffff;

            font-family:
                "AndyB",
                Arial,
                sans-serif;

            overflow: hidden;

            image-rendering: pixelated;
        }


        /* =================================================
           BACKGROUND
        ================================================= */

        #stars {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 0;

            pointer-events: none;
        }


        #meteors {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 1;

            pointer-events: none;

            overflow: hidden;
        }


        /* =================================================
           NAVIGATION
        ================================================= */

        .pixel-tabs {

            position: fixed;

            top: 20px;
            right: 24px;

            display: flex;

            align-items: center;

            gap: 4px;

            padding: 5px;

            z-index: 1000;

            background: #000000;

            border: 2px solid #1c1c1c;

            box-shadow:
                3px 3px 0 #000000;

            white-space: nowrap;
        }


        .pixel-tab {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            height: 36px;

            min-width: 68px;

            padding: 0 13px;

            border: 0;

            background: #000000;

            color: #ffffff;

            font-family:
                "AndyB",
                Arial,
                sans-serif;

            font-size: 18px;

            cursor: pointer;

            box-shadow:
                inset 2px 2px 0 #222222,
                inset -2px -2px 0 #000000;
        }


        .pixel-tab:hover {
            background: #161616;
        }


        .pixel-tab.active {

            background: #0b0b0b;

            box-shadow:
                inset 0 -2px 0 #ffffff,
                inset 2px 2px 0 #292929;
        }


        /* =================================================
           EYE OF CTHULHU BUTTON
        ================================================= */

        .cthulhu-button {

            width: 36px;
            height: 36px;

            padding: 3px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #000000;

            border: 0;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                inset 2px 2px 0 #222222,
                inset -2px -2px 0 #000000;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }


        .cthulhu-button:hover {

            background: #161616;

            transform:
                scale(1.08);
        }


        .cthulhu-button img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            image-rendering: pixelated;

            pointer-events: none;
        }


        /* =================================================
           CTHULHU OVERLAY
        ================================================= */

        .cthulhu-overlay {

            position: fixed;

            inset: 0;

            z-index: 5000;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.82
                );

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }


        .cthulhu-overlay.visible {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        .cthulhu-eye {

            width: min(
                420px,
                70vw
            );

            height: min(
                420px,
                70vw
            );

            object-fit: contain;

            image-rendering: pixelated;

            transform:
                scale(0.15)
                rotate(-8deg);

            opacity: 0;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255,255,255,.7)
                )
                drop-shadow(
                    0 0 25px
                    rgba(255,50,150,.8)
                );

            transition:
                transform 0.25s
                cubic-bezier(.2,1.5,.4,1),
                opacity 0.15s ease;
        }


        .cthulhu-overlay.visible
        .cthulhu-eye {

            transform:
                scale(1)
                rotate(0deg);

            opacity: 1;
        }


        /* =================================================
           CTHULHU DASH EFFECT
        ================================================= */

        .cthulhu-dash {

            position: absolute;

            width: 100vw;
            height: 3px;

            background:
                #ffffff;

            box-shadow:
                0 0 8px #ffffff,
                0 0 20px #ff72cf,
                0 0 40px #ff72cf;

            transform:
                scaleX(0);

            opacity: 0;

            pointer-events: none;
        }


        .cthulhu-overlay.dashing
        .cthulhu-dash {

            animation:
                cthulhuDash
                0.32s
                ease-out;
        }


        @keyframes cthulhuDash {

            0% {

                transform:
                    translateX(-100vw)
                    scaleX(0.1);

                opacity: 0;
            }

            20% {

                opacity: 1;
            }

            50% {

                transform:
                    translateX(0)
                    scaleX(1);

                opacity: 1;
            }

            100% {

                transform:
                    translateX(100vw)
                    scaleX(0.1);

                opacity: 0;
            }
        }


        /* =================================================
           EYE GLITCH
        ================================================= */

        .cthulhu-overlay.glitch
        .cthulhu-eye {

            animation:
                cthulhuGlitch
                0.38s
                steps(5);
        }


        @keyframes cthulhuGlitch {

            0% {
                transform:
                    scale(1)
                    translate(0);
            }

            20% {
                transform:
                    scale(1.03)
                    translate(-8px, 3px);
            }

            40% {
                transform:
                    scale(.97)
                    translate(7px, -4px);
            }

            60% {
                transform:
                    scale(1.02)
                    translate(-4px, -2px);
            }

            80% {
                transform:
                    scale(.99)
                    translate(5px, 3px);
            }

            100% {
                transform:
                    scale(1)
                    translate(0);
            }
        }


        /* =================================================
           MAIN
        ================================================= */

        main {

            position: relative;

            width: 100vw;
            height: 100vh;

            z-index: 10;
        }


        /* =================================================
           PAGES
        ================================================= */

        .pixel-page {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            width: 100vw;
            height: 100vh;

            padding:
                100px
                30px
                30px;
        }


        .pixel-page.active {
            display: flex;
        }


        /* =================================================
           LIVE
        ================================================= */

        .live-content {

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 24px;

            width: 100%;
        }


        /* =================================================
           USERNAME PNG
        ================================================= */

        .username-png {

            display: block;

            width: 520px;

            max-width: 85vw;

            height: auto;

            object-fit: contain;

            image-rendering: pixelated;

            user-select: none;

            pointer-events: none;
        }


        /* =================================================
           DISCORD CONTAINER
        ================================================= */

        .discord-card-container {

            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            max-width: 100%;

            flex-shrink: 0;
        }


        /* =================================================
           WAVEFORM
        ================================================= */

        .waveform-wrapper {

            position: relative;

            width: 520px;

            max-width: 85vw;

            flex-shrink: 0;

            z-index: 20;
        }


        /* =================================================
           DISCORD CARD
        ================================================= */

        .discord-live-card {

            position: relative;

            width: 100%;

            padding: 24px;

            background:
                rgba(
                    5,
                    5,
                    5,
                    0.92
                );

            border:
                2px solid #ffffff;

            box-shadow:
                6px 6px 0 #000000;

            z-index: 10;
        }


        /* =================================================
           DISCORD PROFILE
        ================================================= */

        .discord-profile {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .discord-avatar {

            width: 62px;
            height: 62px;

            object-fit: cover;

            image-rendering: pixelated;

            border:
                2px solid #ffffff;
        }


        .discord-name {

            font-size: 24px;

            color: #ffffff;
        }


        .discord-status {

            margin-top: 4px;

            font-size: 13px;
        }


        .status-online {
            color: #7cff7c;
        }


        .status-idle {
            color: #ffd65c;
        }


        .status-dnd {
            color: #ff6666;
        }


        .status-offline {
            color: #888888;
        }


        /* =================================================
           ACTIVITY
        ================================================= */

        .discord-activity {

            margin-top: 16px;

            padding-top: 12px;

            border-top:
                2px solid #222222;
        }


        .discord-activity-title {

            font-size: 12px;

            color: #ff72cf;

            letter-spacing: 2px;
        }


        .discord-activity-text {

            margin-top: 4px;

            font-size: 19px;

            color: #ffffff;
        }


        /* =================================================
           SPOTIFY
        ================================================= */

        .discord-spotify {

            margin-top: 14px;

            padding-top: 12px;

            border-top:
                2px solid #222222;
        }


        .discord-section-label {

            font-size: 12px;

            color: #ff72cf;

            letter-spacing: 2px;
        }


        .spotify-row {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 8px;
        }


        .spotify-art {

            width: 48px;
            height: 48px;

            object-fit: cover;

            image-rendering: pixelated;
        }


        .spotify-song {

            font-size: 16px;

            color: #ffffff;
        }


        .spotify-artist {

            margin-top: 2px;

            font-size: 13px;

            color: #aaaaaa;
        }


        /* =================================================
           CLOCK
        ================================================= */

        .local-clock {

            margin-top: 16px;

            padding-top: 12px;

            border-top:
                2px solid #222222;

            text-align: center;
        }


        .clock-time {

            font-size: 27px;

            line-height: 1;

            color: #ffffff;

            text-shadow:
                2px 2px 0 #000000;
        }


        .clock-label {

            margin-top: 5px;

            font-size: 11px;

            letter-spacing: 2px;

            color: #ff72cf;
        }


        /* =================================================
           GENERAL PANELS
        ================================================= */

        .pixel-panel {

            position: relative;

            width:
                min(
                    700px,
                    85vw
                );

            padding: 35px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.82
                );

            border:
                2px solid #ffffff;

            box-shadow:
                6px 6px 0 #000000;

            text-align: center;
        }


        .pixel-label {

            margin:
                0 0 8px;

            font-size: 18px;

            color: #aaaaaa;
        }


        .pixel-panel h1 {

            margin:
                0 0 15px;

            font-size:
                clamp(
                    36px,
                    5vw,
                    64px
                );

            font-weight: normal;

            color: #ffffff;

            text-shadow:
                3px 3px 0 #000000;
        }


        .pixel-description {

            margin: 0;

            color: #bdbdbd;

            font-size: 18px;

            line-height: 1.5;
        }


        /* =================================================
           MUSIC
        ================================================= */

        .music-card {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-top: 25px;

            padding: 12px;

            background: #080808;

            border:
                1px solid #333333;

            text-align: left;
        }


        .music-cover {

            width: 55px;
            height: 55px;

            flex-shrink: 0;

            background: #151515;

            border:
                1px solid #444444;
        }


        .music-info {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .music-info strong {

            color: #ffffff;

            font-size: 17px;
        }


        .music-info span {

            color: #888888;

            font-size: 15px;
        }


        /* =================================================
           LINKS
        ================================================= */

        .link-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 8px;

            margin-top: 25px;
        }


        .pixel-link {

            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 45px;

            background: #050505;

            border:
                1px solid #333333;

            color: #ffffff;

            text-decoration: none;

            font-size: 18px;
        }


        .pixel-link:hover {

            background: #171717;

            border-color: #ffffff;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            .pixel-tabs {

                top: 12px;

                right: 12px;
                left: 12px;

                max-width:
                    calc(
                        100vw - 24px
                    );

                overflow-x: auto;

                justify-content:
                    flex-start;
            }


            .pixel-tab {

                min-width: 55px;

                height: 32px;

                padding:
                    0 9px;

                font-size: 15px;
            }


            .cthulhu-button {

                width: 32px;
                height: 32px;
            }


            .pixel-page {

                padding:
                    80px
                    15px
                    20px;
            }


            .live-content {

                gap: 20px;
            }


            .username-png {

                width: 390px;

                max-width: 88vw;
            }


            .waveform-wrapper {

                width: 390px;

                max-width: 90vw;
            }


            .discord-live-card {

                padding: 18px;
            }


            .discord-avatar {

                width: 55px;
                height: 55px;
            }


            .discord-name {

                font-size: 21px;
            }


            .pixel-panel {

                width: 92vw;

                padding:
                    25px
                    18px;
            }


            .link-grid {

                grid-template-columns:
                    1fr;
            }


            .cthulhu-eye {

                width: 75vw;
                height: 75vw;
            }

        }

    </style>


    <link
        rel="stylesheet"
        href="./css/background.css"
    >

    <link
        rel="stylesheet"
        href="./css/waveform.css"
    >

    <link
        rel="stylesheet"
        href="./css/meteors.css"
    >

    <link
        rel="stylesheet"
        href="./css/main.css"
    >

</head>


<body>


    <!-- =================================================
         BACKGROUND
    ================================================= -->

    <div
        id="stars"
        aria-hidden="true"
    ></div>


    <div
        id="meteors"
        aria-hidden="true"
    ></div>


    <!-- =================================================
         CTHULHU EASTER EGG
    ================================================= -->

    <div
        id="cthulhu-overlay"
        class="cthulhu-overlay"
        aria-hidden="true"
    >

        <div
            class="cthulhu-dash"
        ></div>


        <img
            id="cthulhu-eye"
            class="cthulhu-eye"
            src="./assets/images/eye-of-cthulhu.png"
            alt="Eye of Cthulhu"
        >

    </div>


    <!-- =================================================
         NAVIGATION
    ================================================= -->

    <nav
        class="pixel-tabs"
        aria-label="Main navigation"
    >


        <!-- EYE BUTTON -->

        <button
            id="cthulhu-button"
            class="cthulhu-button"
            type="button"
            aria-label="Eye of Cthulhu"
        >

            <img
                src="./assets/images/eye-of-cthulhu.png"
                alt=""
            >

        </button>


        <!-- LIVE -->

        <button
            class="pixel-tab active"
            data-page="live"
            type="button"
        >
            LIVE
        </button>


        <button
            class="pixel-tab"
            data-page="music"
            type="button"
        >
            MUSIC
        </button>


        <button
            class="pixel-tab"
            data-page="links"
            type="button"
        >
            LINKS
        </button>


        <button
            class="pixel-tab"
            data-page="tools"
            type="button"
        >
            TOOLS
        </button>


        <button
            class="pixel-tab"
            data-page="about"
            type="button"
        >
            ABOUT
        </button>

    </nav>


    <!-- =================================================
         MAIN
    ================================================= -->

    <main>


        <!-- =================================================
             LIVE
        ================================================= -->

        <section
            id="live"
            class="pixel-page active"
        >

            <div class="live-content">


                <img
                    class="username-png"
                    src="./assets/images/username.png"
                    alt="Ralkerie"
                >


                <div
                    id="discord-card-container"
                    class="discord-card-container"
                >

                    <div class="discord-live-card">

                        Loading Discord...

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             MUSIC
        ================================================= -->

        <section
            id="music"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    MUSIC
                </p>

                <h1>
                    NOW PLAYING
                </h1>

                <div class="music-card">

                    <div class="music-cover"></div>

                    <div class="music-info">

                        <strong>
                            No song playing
                        </strong>

                        <span>
                            Spotify
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             LINKS
        ================================================= -->

        <section
            id="links"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    LINKS
                </h1>

                <div class="link-grid">

                    <a
                        href="#"
                        class="pixel-link"
                    >
                        DISCORD
                    </a>


                    <a
                        href="https://github.com/Joahm123/ralkerie.github.io"
                        class="pixel-link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GITHUB
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        SPOTIFY
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        OTHER
                    </a>

                </div>

            </div>

        </section>


        <!-- =================================================
             TOOLS
        ================================================= -->

        <section
            id="tools"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    TOOLS
                </h1>

                <p class="pixel-description">
                    Tools and projects will go here.
                </p>

            </div>

        </section>


        <!-- =================================================
             ABOUT
        ================================================= -->

        <section
            id="about"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    ABOUT
                </h1>

                <p class="pixel-description">
                    Welcome to my little corner
                    of the internet.
                </p>

            </div>

        </section>


    </main>


    <!-- =================================================
         JAVASCRIPT
    ================================================= -->

    <script src="./js/stars.js"></script>

    <script src="./js/meteors.js"></script>

    <script src="./js/main.js"></script>

    <script src="./js/discord.js"></script>

    <script src="./js/waveform.js"></script>


    <!-- =================================================
         NAVIGATION + CTHULHU
    ================================================= -->

    <script>

        (() => {

            "use strict";


            /* =============================================
               NORMAL PAGE TABS
            ============================================= */

            const tabs =
                document.querySelectorAll(
                    ".pixel-tab"
                );


            const pages =
                document.querySelectorAll(
                    ".pixel-page"
                );


            tabs.forEach(
                tab => {

                    tab.addEventListener(
                        "click",
                        () => {

                            const pageName =
                                tab.dataset.page;


                            if (!pageName) {
                                return;
                            }


                            tabs.forEach(
                                other => {

                                    other.classList.toggle(
                                        "active",
                                        other === tab
                                    );

                                }
                            );


                            pages.forEach(
                                page => {

                                    page.classList.toggle(
                                        "active",
                                        page.id === pageName
                                    );

                                }
                            );

                        }
                    );

                }
            );


            /* =============================================
               CTHULHU
            ============================================= */

            const button =
                document.getElementById(
                    "cthulhu-button"
                );


            const overlay =
                document.getElementById(
                    "cthulhu-overlay"
                );


            if (
                !button ||
                !overlay
            ) {

                return;
            }


            let open =
                false;


            function openCthulhu() {

                open = true;


                overlay.classList.add(
                    "visible"
                );


                overlay.setAttribute(
                    "aria-hidden",
                    "false"
                );


                /*
                 * Trigger dash after
                 * the eye starts appearing.
                 */

                requestAnimationFrame(
                    () => {

                        overlay.classList.remove(
                            "dashing"
                        );

                        overlay.classList.remove(
                            "glitch"
                        );


                        void overlay.offsetWidth;


                        overlay.classList.add(
                            "dashing"
                        );


                        overlay.classList.add(
                            "glitch"
                        );

                    }
                );

            }


            function closeCthulhu() {

                open = false;


                overlay.classList.remove(
                    "visible"
                );

                overlay.classList.remove(
                    "dashing"
                );

                overlay.classList.remove(
                    "glitch"
                );


                overlay.setAttribute(
                    "aria-hidden",
                    "true"
                );

            }


            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    if (open) {

                        closeCthulhu();

                    } else {

                        openCthulhu();

                    }

                }
            );


            overlay.addEventListener(
                "click",
                event => {

                    if (
                        event.target === overlay
                    ) {

                        closeCthulhu();

                    }

                }
            );


            document.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Escape" &&
                        open
                    ) {

                        closeCthulhu();

                    }

                }
            );


        })();

    </script>


</body>

</html>
