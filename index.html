
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ralkerie</title>


    <!-- =================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/main.css"
    >

    <link
        rel="stylesheet"
        href="./css/background.css"
    >

    <link
        rel="stylesheet"
        href="./css/meteors.css"
    >

    <link
        rel="stylesheet"
        href="./css/waveform.css"
    >


    <!-- =================================================
         DISCORD CARD CSS
    ================================================== -->

    <style>

        .live-content {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 18px;

            width: 100%;

        }


        .username-png {

            display: block;

            width: 280px;

            max-width: 70vw;

            height: auto;

            object-fit: contain;

            image-rendering: pixelated;

            user-select: none;

            pointer-events: none;

        }


        .discord-card-container {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

        }


        .discord-live-card {

            width: min(
                620px,
                90vw
            );

            padding: 24px;

            background: #050505;

            border: 2px solid #ffffff;

            box-shadow:
                6px 6px 0 #000000;

        }


        .discord-profile {

            display: flex;

            align-items: center;

            gap: 18px;

        }


        .discord-avatar {

            width: 76px;

            height: 76px;

            object-fit: cover;

            image-rendering: pixelated;

            border: 2px solid #ffffff;

        }


        .discord-name {

            font-size: 28px;

            color: #ffffff;

        }


        .discord-status {

            margin-top: 5px;

            font-size: 14px;

        }


        .status-online {

            color: #7cff7c;

        }


        .status-idle {

            color: #ffd65c;

        }


        .status-dnd {

            color: #ff6666;

        }


        .status-offline {

            color: #888888;

        }


        .discord-activity {

            margin-top: 24px;

            padding-top: 18px;

            border-top:
                2px solid #222222;

        }


        .discord-activity-title {

            font-size: 13px;

            color: #ff72cf;

            letter-spacing: 2px;

        }


        .discord-activity-text {

            margin-top: 6px;

            font-size: 22px;

            color: #ffffff;

        }


        .discord-spotify {

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                2px solid #222222;

        }


        .discord-section-label {

            font-size: 13px;

            color: #ff72cf;

            letter-spacing: 2px;

        }


        .spotify-row {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-top: 10px;

        }


        .spotify-art {

            width: 58px;

            height: 58px;

            object-fit: cover;

            image-rendering: pixelated;

        }


        .spotify-song {

            font-size: 18px;

            color: #ffffff;

        }


        .spotify-artist {

            margin-top: 3px;

            font-size: 14px;

            color: #aaaaaa;

        }


        /* =================================================
           LOCAL CLOCK
        ================================================== */

        .local-clock {

            margin-top: 24px;

            padding-top: 18px;

            border-top:
                2px solid #222222;

            text-align: center;

        }


        .clock-time {

            font-size: 32px;

            line-height: 1;

            color: #ffffff;

            text-shadow:
                3px 3px 0 #000000;

        }


        .clock-label {

            margin-top: 6px;

            font-size: 12px;

            letter-spacing: 2px;

            color: #ff72cf;

        }


        @media (max-width: 700px) {

            .username-png {

                width: 220px;

                max-width: 65vw;

            }


            .discord-live-card {

                width: 92vw;

                padding: 18px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         BACKGROUND
    ================================================== -->

    <div
        id="stars"
        aria-hidden="true"
    ></div>


    <div
        id="meteors"
        aria-hidden="true"
    ></div>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <nav
        class="pixel-tabs"
        aria-label="Main navigation"
    >

        <button
            class="pixel-tab active"
            data-page="live"
            type="button"
        >
            LIVE
        </button>


        <button
            class="pixel-tab"
            data-page="music"
            type="button"
        >
            MUSIC
        </button>


        <button
            class="pixel-tab"
            data-page="links"
            type="button"
        >
            LINKS
        </button>


        <button
            class="pixel-tab"
            data-page="tools"
            type="button"
        >
            TOOLS
        </button>


        <button
            class="pixel-tab"
            data-page="about"
            type="button"
        >
            ABOUT
        </button>

    </nav>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main>


        <!-- =============================================
             LIVE
        ============================================== -->

        <section
            id="live"
            class="pixel-page active"
        >

            <div class="live-content">


                <!-- =====================================
                     USERNAME PNG
                ====================================== -->

                <img
                    class="username-png"
                    src="./assets/images/username.png"
                    alt="Ralkerie"
                >


                <!-- =====================================
                     DISCORD
                ====================================== -->

                <div
                    id="discord-card-container"
                    class="discord-card-container"
                >

                    <div class="pixel-panel">

                        <p class="pixel-label">
                            RALKERIE
                        </p>

                        <h1>
                            LIVE
                        </h1>

                        <p class="pixel-description">
                            Loading Discord...
                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!-- =============================================
             MUSIC
        ============================================== -->

        <section
            id="music"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    MUSIC
                </p>

                <h1>
                    NOW PLAYING
                </h1>


                <div
                    id="music-card"
                    class="music-card"
                >

                    <div
                        class="music-cover"
                    ></div>


                    <div
                        class="music-info"
                    >

                        <strong>
                            No song playing
                        </strong>

                        <span>
                            Spotify
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- =============================================
             LINKS
        ============================================== -->

        <section
            id="links"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    LINKS
                </h1>


                <div class="link-grid">

                    <a
                        href="#"
                        class="pixel-link"
                    >
                        DISCORD
                    </a>


                    <a
                        href="https://github.com/Joahm123/ralkerie.github.io"
                        class="pixel-link"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GITHUB
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        SPOTIFY
                    </a>


                    <a
                        href="#"
                        class="pixel-link"
                    >
                        OTHER
                    </a>

                </div>

            </div>

        </section>


        <!-- =============================================
             TOOLS
        ============================================== -->

        <section
            id="tools"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    TOOLS
                </h1>

                <p class="pixel-description">
                    Tools and projects will go here.
                </p>

            </div>

        </section>


        <!-- =============================================
             ABOUT
        ============================================== -->

        <section
            id="about"
            class="pixel-page"
        >

            <div class="pixel-panel">

                <p class="pixel-label">
                    RALKERIE
                </p>

                <h1>
                    ABOUT
                </h1>

                <p class="pixel-description">
                    Welcome to my little corner
                    of the internet.
                </p>

            </div>

        </section>


    </main>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script
        src="./js/stars.js"
    ></script>


    <script
        src="./js/meteors.js"
    ></script>


    <script
        src="./js/waveform.js"
    ></script>


    <script
        src="./js/main.js"
    ></script>


    <script
        src="./js/discord.js"
    ></script>


</body>

</html>
